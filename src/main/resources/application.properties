# ===== Application =====
spring.application.name=nenecare
server.port=8081

# ===== Base de donnees PostgreSQL =====
# Les valeurs apres ':' sont les defauts de developpement local.
# En production / demo, definir les variables d'environnement DB_* et JWT_SECRET.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nenecare}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
# IMPORTANT : remplacer le secret par defaut via la variable JWT_SECRET (>= 32 caracteres).
jwt.secret=${JWT_SECRET:dev-secret-nenecare-a-remplacer-32caracteres-minimum}
# Expiration : 30 minutes (US-02)
jwt.expiration=1800000

# ===== Audit =====
# Cle de signature HMAC-SHA256 du journal d'audit (Base64, >= 32 octets).
# IMPORTANT : definir AUDIT_HMAC_KEY en demo/production.
# Generer une cle : openssl rand -base64 32
nenecare.audit.hmac-key=${AUDIT_HMAC_KEY:ZGV2LWF1ZGl0LWhtYWMta2V5LWEtcmVtcGxhY2VyLTMyLW9jdGV0cyE=}

# ===== Protection des dossiers medicaux =====
# Cle AES-256 du chiffrement des donnees medicales au repos (OS-03).
# EXACTEMENT 32 octets une fois decodee, sinon l'application refuse de demarrer.
# Generer une cle : openssl rand -base64 32
nenecare.crypto.aes-key=${CRYPTO_AES_KEY:bmVuZWNhcmUtZGVmYXV0LWFlcy1hLXJlbXBsYWNlciE=}
# Cle HMAC-SHA256 de la signature d'integrite des dossiers (OS-07).
nenecare.crypto.hmac-key=${CRYPTO_HMAC_KEY:bmVuZWNhcmUtZGVmYXV0LWhtYWMtYS1yZW1wbGFjZSE=}

# ===== Comptes de demonstration =====
# Actif uniquement si explicitement demande (profil dev). Jamais en production.
nenecare.demo.enabled=${DEMO_USERS:false}
nenecare.demo.mot-de-passe=${DEMO_PASSWORD:NeneCare2026!}
