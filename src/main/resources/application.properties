# ===== Application =====
spring.application.name=nenecare
server.port=8081

# ===== Base de donnees PostgreSQL =====
# Les valeurs apres ':' sont les defauts de developpement local.
# En production / demo, definir les variables d'environnement DB_* et JWT_SECRET.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nenecare}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
# IMPORTANT : remplacer le secret par defaut via la variable JWT_SECRET (>= 32 caracteres).
jwt.secret=${JWT_SECRET:dev-secret-nenecare-a-remplacer-32caracteres-minimum}
# Expiration : 30 minutes (US-02)
jwt.expiration=1800000
