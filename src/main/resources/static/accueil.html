<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeneCare – Accueil</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">

    <div class="main-header">
      <div>
        <h1>Tableau de bord</h1>
        <p id="dateNow">Chargement de la date…</p>
      </div>
      <div class="header-actions" id="actionsEntete"></div>
    </div>

    <!-- Alerte sécurité : affichée seulement s'il y a effectivement des échecs -->
    <div class="security-alert" id="alerteSecurite" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <div>
        <div class="security-alert-title" id="alerteSecuriteTitre"></div>
        <div class="security-alert-desc" id="alerteSecuriteDetail"></div>
      </div>
    </div>

    <div class="kpi-grid" id="grilleKpi"></div>

    <div class="two-col">

      <div class="card">
        <div class="card-header">
          <span class="card-title" id="titreListe">Dossiers récents</span>
          <a class="card-action" href="/dossiers.html#dossiers" id="lienTousDossiers">Tout voir</a>
        </div>
        <div class="table-wrap" id="zoneDossiers">
          <div class="vide">Chargement…</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Journal d'audit récent</span>
          <a class="card-action" href="#" id="lienRafraichirAudit">Rafraîchir</a>
        </div>
        <div class="audit-list" id="listeAudit">
          <div class="vide">Chargement…</div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script>
// =============================================================================
// Tableau de bord NeneCare - Proprietaire : Hadja (frontend).
//
// Tous les chiffres affiches proviennent d'appels API reels : rien n'est
// code en dur. Un role qui n'a pas acces a un module voit une carte "non
// accessible" plutot qu'un zero, qui laisserait croire que la clinique n'a
// aucun dossier.
// =============================================================================

const { el, vide, date, dateHeure } = NeneCareShell;

const utilisateur = NeneCareShell.monter('tableau');
if (!utilisateur) { throw new Error('Redirection vers la connexion'); }

const DROITS = {
  patientes : ['ADMIN','GYNECOLOGUE','PEDIATRE','SAGE_FEMME','INFIRMIER','SECRETAIRE'],
  dossiers  : ['ADMIN','GYNECOLOGUE','SAGE_FEMME','INFIRMIER'],
  neonatals : ['ADMIN','PEDIATRE','SAGE_FEMME','INFIRMIER'],
  audit     : ['ADMIN']
};
const peut = cle => NeneCareShell.peut(DROITS[cle]);

document.getElementById('dateNow').textContent =
  new Date().toLocaleDateString('fr-FR',
    { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

// ─────────────────────────────────────────────────────────────────────────────
// Raccourcis d'en-tête
// ─────────────────────────────────────────────────────────────────────────────

(function construireActions() {
  const zone = document.getElementById('actionsEntete');
  const lien = (libelle, href, style) => {
    const bouton = el('a', 'btn ' + style, libelle);
    bouton.href = href;
    zone.appendChild(bouton);
  };
  if (peut('patientes')) lien('Patientes', '/dossiers.html#patientes', 'btn-outline');
  if (peut('dossiers'))  lien('Dossiers médicaux', '/dossiers.html#dossiers', 'btn-primary');
  else if (peut('neonatals')) lien('Dossiers néonatals', '/dossiers.html#neonatals', 'btn-primary');
})();

// ─────────────────────────────────────────────────────────────────────────────
// Cartes de synthèse
// ─────────────────────────────────────────────────────────────────────────────

const ICONES_KPI = {
  patientes: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>',
  dossiers:  '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
  neonatals: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  securite:  '<polyline points="20 6 9 17 4 12"/>'
};

function carteKpi(libelle, valeur, sousTitre, icone, couleur) {
  const carte = el('div', 'kpi-card');
  const haut = el('div', 'kpi-top');
  haut.appendChild(el('span', 'kpi-label', libelle));
  const rond = el('div', 'kpi-icon ' + couleur);
  rond.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" '
                 + 'stroke-width="2">' + ICONES_KPI[icone] + '</svg>';
  haut.appendChild(rond);
  carte.appendChild(haut);
  carte.appendChild(el('div', 'kpi-value', valeur));
  carte.appendChild(el('div', 'kpi-sub', sousTitre));
  return carte;
}

// ─────────────────────────────────────────────────────────────────────────────
// Chargement
// ─────────────────────────────────────────────────────────────────────────────

/** Appelle l'API en rendant la valeur de repli plutôt qu'en cassant la page. */
async function essayer(url, repli) {
  try {
    return await NeneCareApi.get(url) || repli;
  } catch (err) {
    return null;   // null = non accessible pour ce rôle
  }
}

async function chargerTableauDeBord() {
  const [patientes, dossiers, neonatals] = await Promise.all([
    peut('patientes') ? essayer('/api/patientes', []) : Promise.resolve(null),
    peut('dossiers')  ? essayer('/api/dossiers', [])  : Promise.resolve(null),
    peut('neonatals') ? essayer('/api/neonatals', []) : Promise.resolve(null)
  ]);

  const grille = document.getElementById('grilleKpi');
  grille.replaceChildren();

  grille.appendChild(patientes === null
    ? carteKpi('Patientes', '—', 'Non accessible pour votre rôle', 'patientes', 'teal')
    : carteKpi('Patientes suivies', String(patientes.length),
        'Coordonnées chiffrées AES-256-GCM', 'patientes', 'teal'));

  grille.appendChild(dossiers === null
    ? carteKpi('Dossiers de suivi', '—', 'Non accessible pour votre rôle', 'dossiers', 'amber')
    : carteKpi('Dossiers de suivi',
        String(dossiers.filter(d => d.statut !== 'ARCHIVE').length),
        dossiers.filter(d => d.statut === 'ARCHIVE').length + ' archivé(s)',
        'dossiers', 'amber'));

  grille.appendChild(neonatals === null
    ? carteKpi('Nouveau-nés', '—', 'Non accessible pour votre rôle', 'neonatals', 'green')
    : carteKpi('Nouveau-nés', String(neonatals.length),
        'Chacun rattaché à sa mère', 'neonatals', 'green'));

  // Intégrité : calculée sur ce que le rôle a effectivement pu lire.
  const signes = [].concat(dossiers || [], neonatals || []);
  if (signes.length === 0) {
    grille.appendChild(carteKpi('Intégrité HMAC', '—',
      'Aucun dossier lisible par votre rôle', 'securite', 'green'));
  } else {
    const valides = signes.filter(d => d.integre).length;
    const taux = Math.round((valides / signes.length) * 100);
    grille.appendChild(carteKpi('Intégrité HMAC', taux + '%',
      valides === signes.length
        ? '✓ ' + signes.length + ' signature(s) vérifiée(s)'
        : '⚠ ' + (signes.length - valides) + ' dossier(s) altéré(s)',
      'securite', valides === signes.length ? 'green' : 'red'));
  }

  remplirListe(dossiers, neonatals);
}

function remplirListe(dossiers, neonatals) {
  const zone = document.getElementById('zoneDossiers');
  const titre = document.getElementById('titreListe');
  const lien = document.getElementById('lienTousDossiers');

  let lignes;
  if (dossiers !== null && dossiers.length > 0) {
    titre.textContent = 'Dossiers de suivi récents';
    lien.href = '/dossiers.html#dossiers';
    lignes = dossiers.slice(0, 6).map(d => [
      d.numeroDossier, d.patienteNom, date(d.dateConsultation), d.motif || '—',
      NeneCareShell.badge(d.integre ? '✓ signé' : '⚠ altéré', d.integre ? 'ok' : 'alerte')
    ]);
    afficherTableau(zone, ['N°', 'Patiente', 'Consultation', 'Motif', 'Intégrité'], lignes);

  } else if (neonatals !== null && neonatals.length > 0) {
    titre.textContent = 'Nouveau-nés récents';
    lien.href = '/dossiers.html#neonatals';
    lignes = neonatals.slice(0, 6).map(n => [
      n.numeroDossier, n.nomBebe, date(n.dateNaissance),
      n.poidsGrammes ? n.poidsGrammes + ' g' : '—',
      NeneCareShell.badge(n.integre ? '✓ signé' : '⚠ altéré', n.integre ? 'ok' : 'alerte')
    ]);
    afficherTableau(zone, ['N°', 'Nouveau-né', 'Naissance', 'Poids', 'Intégrité'], lignes);

  } else if (dossiers === null && neonatals === null) {
    titre.textContent = 'Dossiers';
    lien.href = '/dossiers.html#patientes';
    zone.replaceChildren(vide(
      "Votre rôle (" + utilisateur.role + ") n'a pas accès au contenu médical."));
  } else {
    zone.replaceChildren(vide('Aucun dossier enregistré pour le moment.'));
  }
}

function afficherTableau(zone, entetes, lignes) {
  const table = el('table');
  const thead = el('thead');
  const tr = el('tr');
  entetes.forEach(e => tr.appendChild(el('th', null, e)));
  thead.appendChild(tr);
  table.appendChild(thead);

  const tbody = el('tbody');
  lignes.forEach(cellules => {
    const ligne = el('tr');
    cellules.forEach(cellule => {
      const td = el('td');
      if (cellule instanceof Node) td.appendChild(cellule);
      else td.textContent = cellule;
      ligne.appendChild(td);
    });
    tbody.appendChild(ligne);
  });
  table.appendChild(tbody);
  zone.replaceChildren(table);
}

// ─────────────────────────────────────────────────────────────────────────────
// Journal d'audit (administrateur)
// ─────────────────────────────────────────────────────────────────────────────

const ICONES_AUDIT = {
  LOGIN_SUCCESS:   { classe: 'login', svg: '<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/>' },
  LOGOUT:          { classe: 'login', svg: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/>' },
  LOGIN_FAILURE:   { classe: 'warn',  svg: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>' },
  LOGIN_BLOCKED:   { classe: 'warn',  svg: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>' },
  ACCES_REFUSE:    { classe: 'warn',  svg: '<circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>' },
  ACCES_URGENCE:   { classe: 'warn',  svg: '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>' },
  DOSSIER_READ:    { classe: 'read',  svg: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>' },
  NEONATAL_READ:   { classe: 'read',  svg: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>' },
  PATIENTE_READ:   { classe: 'read',  svg: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>' },
  DEFAUT:          { classe: 'write', svg: '<polyline points="20 6 9 17 4 12"/>' }
};

function ligneAudit(entree) {
  const icone = ICONES_AUDIT[entree.action] || ICONES_AUDIT.DEFAUT;
  const item = el('div', 'audit-item');

  const pastille = el('div', 'audit-dot ' + icone.classe);
  pastille.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" '
                     + 'stroke-width="2.5">' + icone.svg + '</svg>';

  const meta = el('div', 'audit-meta');
  meta.appendChild(el('div', 'audit-action', entree.action));
  meta.appendChild(el('div', 'audit-detail',
    [entree.utilisateur, entree.adresseIp, entree.ressource].filter(Boolean).join(' · ')));

  item.appendChild(pastille);
  item.appendChild(meta);
  item.appendChild(el('div', 'audit-time', heure(entree.timestamp)));
  return item;
}

function heure(horodatage) {
  const d = new Date(horodatage);
  if (isNaN(d)) return '';
  return new Date().toDateString() === d.toDateString()
    ? d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
    : d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
}

const APERCU = 8;

async function chargerAudit() {
  const liste = document.getElementById('listeAudit');
  liste.replaceChildren();

  if (!peut('audit')) {
    liste.replaceChildren(vide("Le journal d'audit est réservé à l'administrateur."));
    return;
  }

  try {
    const entrees = await NeneCareApi.get('/api/audit/logs') || [];

    if (entrees.length === 0) {
      liste.appendChild(vide('Aucun évènement enregistré pour le moment.'));
    } else {
      entrees.slice(0, APERCU).forEach(e => liste.appendChild(ligneAudit(e)));
      if (entrees.length > APERCU) {
        liste.appendChild(vide((entrees.length - APERCU)
          + " évènement(s) plus ancien(s) — voir « Journal d'audit »."));
      }
    }

    signalerEchecs(entrees);

  } catch (err) {
    liste.appendChild(vide('Journal indisponible : ' + err.message));
  }
}

function signalerEchecs(entrees) {
  const echecs = entrees.filter(e => e.succes === false);
  if (echecs.length === 0) return;

  const dernier = echecs[0];
  document.getElementById('alerteSecuriteTitre').textContent =
    echecs.length + ' tentative(s) refusée(s) enregistrée(s)';
  document.getElementById('alerteSecuriteDetail').textContent =
    'Dernière : ' + dernier.action + ' · ' + dernier.utilisateur
    + (dernier.adresseIp ? ' · IP ' + dernier.adresseIp : '')
    + ' · ' + dateHeure(dernier.timestamp);
  document.getElementById('alerteSecurite').style.display = 'flex';
}

document.getElementById('lienRafraichirAudit').addEventListener('click', e => {
  e.preventDefault();
  chargerAudit();
});

chargerTableauDeBord();
chargerAudit();
</script>
</body>
</html>
