<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeneCare</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!--
      Page d'entree : aiguille vers le tableau de bord si une session est
      ouverte, vers la connexion sinon. Aucun contenu propre, pour eviter
      d'avoir deux pages d'accueil a maintenir (voir accueil.html).
    -->
    <main class="contenu">
        <h1>NeneCare</h1>
        <p class="info">Redirection en cours…</p>
        <noscript>
            <p>JavaScript est necessaire pour utiliser NeneCare. Acceder
               directement a <a href="/login.html">la page de connexion</a>.</p>
        </noscript>
    </main>

    <script src="/js/api.js"></script>
    <script>
        window.location.replace(
            NeneCareApi.estConnecte() ? '/accueil.html' : '/login.html');
    </script>
</body>
</html>
