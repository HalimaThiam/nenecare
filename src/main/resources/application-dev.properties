# =============================================================================
# Profil DEV : base H2 en memoire, aucune installation requise.
# Lancement :  ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# A utiliser pour tester l'application rapidement (demo, dev frontend, recette).
# Le profil par defaut (sans -Dspring-boot.run.profiles) reste PostgreSQL.
# =============================================================================

spring.datasource.url=jdbc:h2:mem:nenecare;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Console H2 : http://localhost:8081/h2-console  (JDBC URL ci-dessus, user "sa")
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Comptes de demonstration crees au demarrage (voir DevDataInitializer).
nenecare.demo.enabled=true
nenecare.demo.mot-de-passe=NeneCare2026!

# Secrets de developpement : JAMAIS utilises hors du profil dev.
jwt.secret=dev-only-jwt-secret-nenecare-32-caracteres-minimum
nenecare.audit.hmac-key=ZGV2LW9ubHktYXVkaXQtaG1hYy1rZXktbmVuZWNhcmUtMzJiIQ==
