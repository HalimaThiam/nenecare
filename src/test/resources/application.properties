# Config de TEST : base H2 en memoire (aucune dependance a PostgreSQL).
# Permet a `./mvnw test` de passer sur n'importe quel poste.
spring.datasource.url=jdbc:h2:mem:nenecare;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

jwt.secret=secret-de-test-de-32-caracteres-minimum-pour-hmac
jwt.expiration=1800000
