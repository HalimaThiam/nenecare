# Config de TEST : base H2 en memoire (aucune dependance a PostgreSQL).
# Permet a `./mvnw test` de passer sur n'importe quel poste.
spring.datasource.url=jdbc:h2:mem:nenecare;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

jwt.secret=secret-de-test-de-32-caracteres-minimum-pour-hmac
jwt.expiration=1800000

# Cle HMAC d'audit de test (Base64 de 32+ octets).
nenecare.audit.hmac-key=Y2xlLWhtYWMtZGUtdGVzdC1uZW5lY2FyZS0zMi1vY3RldHMtb2sh

# Pas de comptes de demonstration dans les tests : chaque test cree ses donnees.
nenecare.demo.enabled=false
